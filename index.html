<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jogo da Cobrinha</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --line: #30363d;
    --text: #e6edf3; --muted: #8b949e; --snake: #58a6ff; --head: #a5d6ff; --food: #f85149;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    display: flex; align-items: center; justify-content: center;
  }
  main { width: min(92vw, 440px); }
  header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; }
  h1 { font-size: 1.1rem; font-weight: 600; margin: 0; }
  .placar { color: var(--muted); font-size: .9rem; font-variant-numeric: tabular-nums; }
  .placar b { color: var(--text); font-weight: 600; }
  .tabuleiro { position: relative; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--panel); }
  canvas { display: block; width: 100%; height: auto; touch-action: none; }
  .aviso {
    position: absolute; inset: 0; display: flex; flex-direction: column; gap: 12px;
    align-items: center; justify-content: center; text-align: center; padding: 16px;
    background: rgba(13, 17, 23, .82);
  }
  .aviso[hidden] { display: none; }
  .aviso p { margin: 0; color: var(--muted); font-size: .95rem; }
  .aviso strong { font-size: 1.15rem; }
  button {
    background: #238636; color: #fff; border: 1px solid rgba(240, 246, 252, .1);
    border-radius: 6px; padding: 8px 16px; font: inherit; font-weight: 600; cursor: pointer;
  }
  button:hover { background: #2ea043; }
  button:focus-visible { outline: 2px solid var(--snake); outline-offset: 2px; }
  footer { margin-top: 10px; color: var(--muted); font-size: .8rem; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Jogo da Cobrinha</h1>
    <div class="placar">Pontos <b id="pontos">0</b> &nbsp; Recorde <b id="recorde">0</b></div>
  </header>
  <div class="tabuleiro">
    <canvas id="tela" width="400" height="400" aria-label="Tabuleiro do jogo da cobrinha"></canvas>
    <div class="aviso" id="aviso">
      <strong id="titulo">Jogo da Cobrinha</strong>
      <p id="texto">Use as setas ou WASD. No celular, deslize o dedo.</p>
      <button id="jogar">Jogar</button>
    </div>
  </div>
  <footer>Espaço pausa e retoma a partida.</footer>
</main>

<script>
(() => {
  const N = 20, T = 20;
  const tela = document.getElementById("tela"), ctx = tela.getContext("2d");
  const elPontos = document.getElementById("pontos"), elRecorde = document.getElementById("recorde");
  const aviso = document.getElementById("aviso"), titulo = document.getElementById("titulo"), texto = document.getElementById("texto");
  const botao = document.getElementById("jogar");
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

  let cobra, dir, proxima, comida, pontos, recorde = 0, timer, estado = "parado";

  try { recorde = Number(localStorage.getItem("cobrinha-recorde")) || 0; } catch (e) {}
  elRecorde.textContent = recorde;

  function iniciar() {
    cobra = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
    dir = proxima = { x: 1, y: 0 };
    pontos = 0; elPontos.textContent = 0;
    novaComida();
    estado = "jogando";
    aviso.hidden = true;
    desenhar();
    agendar();
  }

  function novaComida() {
    do { comida = { x: Math.floor(Math.random() * N), y: Math.floor(Math.random() * N) }; }
    while (cobra.some(s => s.x === comida.x && s.y === comida.y));
  }

  function velocidade() { return Math.max(60, 130 - Math.floor(pontos / 5) * 8); }
  function agendar() { clearTimeout(timer); timer = setTimeout(passo, velocidade()); }

  function passo() {
    if (estado !== "jogando") return;
    dir = proxima;
    const cabeca = { x: cobra[0].x + dir.x, y: cobra[0].y + dir.y };
    const comeu = cabeca.x === comida.x && cabeca.y === comida.y;
    const corpo = comeu ? cobra : cobra.slice(0, -1);
    const bateu = cabeca.x < 0 || cabeca.y < 0 || cabeca.x >= N || cabeca.y >= N ||
                  corpo.some(s => s.x === cabeca.x && s.y === cabeca.y);
    if (bateu) return fim();
    cobra.unshift(cabeca);
    if (comeu) {
      pontos++; elPontos.textContent = pontos;
      if (cobra.length === N * N) return fim(true);
      novaComida();
    } else {
      cobra.pop();
    }
    desenhar();
    agendar();
  }

  function fim(venceu) {
    estado = "parado";
    if (pontos > recorde) {
      recorde = pontos; elRecorde.textContent = recorde;
      try { localStorage.setItem("cobrinha-recorde", recorde); } catch (e) {}
    }
    titulo.textContent = venceu ? "Tabuleiro completo" : "Fim de jogo";
    texto.textContent = "Você fez " + pontos + (pontos === 1 ? " ponto." : " pontos.");
    botao.textContent = "Jogar novamente";
    aviso.hidden = false;
    botao.focus();
  }

  function pausar() {
    if (estado === "jogando") {
      estado = "pausado"; clearTimeout(timer);
      titulo.textContent = "Pausado"; texto.textContent = "Pressione espaço para continuar.";
      botao.textContent = "Continuar"; aviso.hidden = false;
    } else if (estado === "pausado") {
      estado = "jogando"; aviso.hidden = true; agendar();
    }
  }

  function desenhar() {
    ctx.fillStyle = css("--panel");
    ctx.fillRect(0, 0, tela.width, tela.height);
    ctx.fillStyle = css("--food");
    ctx.beginPath();
    ctx.roundRect(comida.x * T + 3, comida.y * T + 3, T - 6, T - 6, 4);
    ctx.fill();
    cobra.forEach((s, i) => {
      ctx.fillStyle = i === 0 ? css("--head") : css("--snake");
      ctx.beginPath();
      ctx.roundRect(s.x * T + 1, s.y * T + 1, T - 2, T - 2, 4);
      ctx.fill();
    });
  }

  function virar(x, y) {
    if (estado !== "jogando") return;
    if (x === -dir.x && y === -dir.y) return;
    proxima = { x, y };
  }

  const teclas = {
    ArrowUp: [0, -1], w: [0, -1], W: [0, -1], ArrowDown: [0, 1], s: [0, 1], S: [0, 1],
    ArrowLeft: [-1, 0], a: [-1, 0], A: [-1, 0], ArrowRight: [1, 0], d: [1, 0], D: [1, 0]
  };

  document.addEventListener("keydown", e => {
    if (e.key === " ") { e.preventDefault(); if (estado === "parado") iniciar(); else pausar(); return; }
    const t = teclas[e.key];
    if (!t) return;
    e.preventDefault();
    if (estado === "parado") iniciar();
    virar(t[0], t[1]);
  });

  let toque = null;
  tela.addEventListener("touchstart", e => { toque = e.touches[0]; }, { passive: true });
  tela.addEventListener("touchend", e => {
    if (!toque) return;
    const f = e.changedTouches[0], dx = f.clientX - toque.clientX, dy = f.clientY - toque.clientY;
    toque = null;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
    if (Math.abs(dx) > Math.abs(dy)) virar(dx > 0 ? 1 : -1, 0); else virar(0, dy > 0 ? 1 : -1);
  });

  botao.addEventListener("click", () => { if (estado === "pausado") pausar(); else iniciar(); });

  cobra = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
  comida = { x: 15, y: 10 };
  desenhar();
})();
</script>
</body>
</html>
